# mcfet: monolithic CFET (mCF), NMOS bottom / PMOS top tier, same layout as scfet; backside on a carrier wafer.
csv: mcfet_final.csv
routes:                # carrier wafer, then the flow CSV
  - route: Mono_Carrier_Wafer
    flow: GAA_Blank_Carrier
    module: Wafer Start
    step: substrate
    substrate: {MaterialFilter: Silicon, Thickness: 0.5 um, ColumnSizeX: 0.0025 um, ColumnSizeY: 0.0025 um}
  - {route: mcfet}
layout: mcfet_layout.gds
clip:
  name: H4
  coords: [0.07, -0.016, 0.574, 0.112]   # x0 y0 x1 y1 (um)
die_area_mm2: null
render:
  resolution: 1024x768
  zoom_box: null
  cuts:                # x through a gate, y along a fin / sheet
    - {axis: x, at: 0.38481}
    - {axis: y, at: 0.04875}
